
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Company | CareerNova</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#f8fafc);
    padding:40px 20px;
    color:#1e293b;
}

/* Main Container */

.container{
    max-width:950px;
    margin:auto;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 20px 50px rgba(15,23,42,0.12);
    overflow:hidden;
}

/* Header */

.header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb,#3b82f6);
    color:white;
    padding:30px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-left h1{
    font-size:28px;
    margin-bottom:6px;
}

.header-left p{
    font-size:14px;
    opacity:.9;
}

.logo{
    width:55px;
    height:55px;
    border-radius:14px;
    background:rgba(255,255,255,.18);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:bold;
}

/* Form */

.form-container{
    padding:35px 40px 40px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    color:#1e3a8a;
}

.section-title span{
    width:5px;
    height:24px;
    background:#2563eb;
    border-radius:10px;
}

.section-title h2{
    font-size:19px;
}

/* Grid */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / -1;
}

label{
    font-size:14px;
    font-weight:600;
    margin-bottom:7px;
    color:#334155;
}

.required{
    color:#ef4444;
}

/* Inputs */

input,
textarea,
select{
    width:100%;
    padding:12px 14px;
    border:1px solid #cbd5e1;
    border-radius:9px;
    outline:none;
    font-size:14px;
    color:#1e293b;
    background:#f8fafc;
    transition:.2s;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#2563eb;
    background:#fff;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

textarea{
    min-height:100px;
    resize:vertical;
}

/* Buttons */

.button-area{
    display:flex;
    justify-content:flex-end;
    gap:12px;
    margin-top:30px;
    padding-top:25px;
    border-top:1px solid #e2e8f0;
}

.btn{
    padding:12px 25px;
    border-radius:9px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.btn-cancel{
    background:#f1f5f9;
    color:#475569;
    border:1px solid #cbd5e1;
}

.btn-cancel:hover{
    background:#e2e8f0;
}

.btn-submit{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border:none;
    box-shadow:0 5px 15px rgba(37,99,235,.25);
}

.btn-submit:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(37,99,235,.30);
}

/* Footer */

.form-footer{
    text-align:center;
    margin-top:18px;
    color:#64748b;
    font-size:12px;
}

/* Responsive */

@media(max-width:700px){

    body{
        padding:20px 10px;
    }

    .header{
        padding:25px;
    }

    .form-container{
        padding:25px 20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .header-left h1{
        font-size:23px;
    }

    .button-area{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="header-left">
            <h1>Add New Company</h1>
            <p>Register a company in the CareerNova recruitment platform</p>
        </div>

        <div class="logo">
            CN
        </div>

    </div>


    <!-- Form -->

    <div class="form-container">

        <form action="addCompany" method="post">

            <!-- Basic Information -->

            <div class="section-title">
                <span></span>
                <h2>Company Information</h2>
            </div>

            <div class="form-grid">

                <div class="form-group">
                    <label>
                        Company Name <span class="required">*</span>
                    </label>

                    <input type="text"
                           name="companyName"
                           placeholder="Enter company name"
                           required>
                </div>


                <div class="form-group">
                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input type="email"
                           name="companyEmail"
                           placeholder="company@example.com"
                           required>
                </div>


                <div class="form-group">
                    <label>
                        Password <span class="required">*</span>
                    </label>

                    <input type="password"
                           name="password"
                           placeholder="Create password"
                           required>
                </div>


                <div class="form-group">
                    <label>Phone</label>

                    <input type="tel"
                           name="phone"
                           placeholder="Enter phone number">
                </div>


                <div class="form-group">
                    <label>Website</label>

                    <input type="url"
                           name="website"
                           placeholder="https://example.com">
                </div>


                <div class="form-group">
                    <label>Industry</label>

                    <input type="text"
                           name="industry"
                           placeholder="e.g. IT, Finance, Healthcare">
                </div>


                <div class="form-group">
                    <label>Company Size</label>

                    <input type="number"
                           name="companySize"
                           min="1"
                           placeholder="Number of employees">
                </div>

            </div>


            <!-- Location -->

            <div class="section-title" style="margin-top:35px;">
                <span></span>
                <h2>Company Location</h2>
            </div>

            <div class="form-grid">

                <div class="form-group full">
                    <label>Address</label>

                    <textarea
                        name="address"
                        placeholder="Enter complete company address"></textarea>
                </div>


                <div class="form-group">
                    <label>City</label>

                    <input type="text"
                           name="city"
                           placeholder="Enter city">
                </div>


                <div class="form-group">
                    <label>State</label>

                    <input type="text"
                           name="state"
                           placeholder="Enter state">
                </div>


                <div class="form-group">
                    <label>Pincode</label>

                    <input type="text"
                           name="pincode"
                           placeholder="Enter pincode">
                </div>

            </div>


            <!-- Additional Information -->

            <div class="section-title" style="margin-top:35px;">
                <span></span>
                <h2>Additional Information</h2>
            </div>

            <div class="form-grid">

                <div class="form-group full">

                    <label>Description</label>

                    <textarea
                        name="description"
                        placeholder="Write a short description about the company"></textarea>

                </div>


                <div class="form-group">

                    <label>Status</label>

                    <select name="status">

                        <option value="ACTIVE">
                            ACTIVE
                        </option>

                        <option value="INACTIVE">
                            INACTIVE
                        </option>

                    </select>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-area">

                <button type="reset"
                        class="btn btn-cancel">
                    Clear Form
                </button>

                <button type="submit"
                        class="btn btn-submit">
                    + Add Company
                </button>

            </div>

            <div class="form-footer">
                CareerNova • Smart Recruitment & Career Management Platform
            </div>

        </form>

    </div>

</div>

</body>
</html>
