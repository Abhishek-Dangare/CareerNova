
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CareerNova | Add HR</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef4ff,#f8fafc);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px;
}

/* Main Card */

.container{
    width:920px;
    background:#ffffff;
    border-radius:18px;
    box-shadow:0 15px 45px rgba(15,23,42,.10);
    overflow:hidden;
}

/* Header */

.header{
    background:linear-gradient(135deg,#1d4ed8,#2563eb);
    padding:28px 35px;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.header-left{
    display:flex;
    align-items:center;
    gap:15px;
}

.icon{
    width:52px;
    height:52px;
    background:rgba(255,255,255,.18);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.header h2{
    font-size:23px;
    font-weight:600;
}

.header p{
    font-size:13px;
    opacity:.85;
    margin-top:3px;
}

/* Form */

.form-container{
    padding:35px 40px 30px;
}

.section-title{
    font-size:15px;
    font-weight:600;
    color:#1e293b;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:8px;
}

.section-title span{
    width:4px;
    height:18px;
    background:#2563eb;
    border-radius:5px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px 25px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1 / 3;
}

label{
    font-size:13px;
    font-weight:500;
    color:#334155;
    margin-bottom:7px;
}

.required{
    color:#ef4444;
}

input,
select,
textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid #dbe2ea;
    border-radius:9px;
    outline:none;
    background:#f8fafc;
    color:#1e293b;
    font-size:13px;
    transition:.25s;
}

input::placeholder,
textarea::placeholder{
    color:#94a3b8;
}

input:focus,
select:focus,
textarea:focus{
    background:#fff;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

textarea{
    height:85px;
    resize:none;
}

/* Password */

.password-box{
    position:relative;
}

.password-box input{
    padding-right:40px;
}

/* Buttons */

.button-box{
    margin-top:32px;
    padding-top:22px;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:flex-end;
    gap:12px;
}

button,
.back{
    height:44px;
    padding:0 25px;
    border-radius:9px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:.25s;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    box-shadow:0 5px 12px rgba(37,99,235,.20);
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-1px);
}

.back{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f1f5f9;
    color:#475569;
    text-decoration:none;
    border:1px solid #e2e8f0;
}

.back:hover{
    background:#e2e8f0;
}

/* Responsive */

@media(max-width:700px){

    body{
        padding:15px;
    }

    .container{
        width:100%;
    }

    .header{
        padding:22px;
    }

    .form-container{
        padding:25px 20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:1;
    }

    .button-box{
        justify-content:stretch;
    }

    button,
    .back{
        flex:1;
    }
}

</style>

</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <div class="header-left">

            <div class="icon">
                👨‍💼
            </div>

            <div>
                <h2>Add New HR</h2>
                <p>Create a new HR account for CareerNova</p>
            </div>

        </div>

    </div>


    <!-- Form -->

    <div class="form-container">

        <div class="section-title">
            <span></span>
            HR Information
        </div>

        <form action="AddHR" method="post">

            <div class="form-grid">

                <!-- Company -->

                <div class="form-group">

                    <label>
                        Select Company <span class="required">*</span>
                    </label>

                    <select name="companyId" required>

                        <option value="">
                            -- Select Company --
                        </option>

                        <option value="1">
                            TechNova Solutions
                        </option>

                        <option value="4">
                            Infocis
                        </option>

                    </select>

                </div>


                <!-- First Name -->

                <div class="form-group">

                    <label>
                        First Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="firstName"
                        placeholder="Enter first name"
                        required>

                </div>


                <!-- Last Name -->

                <div class="form-group">

                    <label>
                        Last Name <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="lastName"
                        placeholder="Enter last name"
                        required>

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label>
                        Gender <span class="required">*</span>
                    </label>

                    <select name="gender" required>

                        <option value="">
                            Select Gender
                        </option>

                        <option value="MALE">
                            Male
                        </option>

                        <option value="FEMALE">
                            Female
                        </option>

                        <option value="OTHER">
                            Other
                        </option>

                    </select>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label>
                        Email <span class="required">*</span>
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="hr@example.com"
                        required>

                </div>


                <!-- Mobile -->

                <div class="form-group">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="text"
                        name="mobile"
                        placeholder="Enter mobile number">

                </div>


                <!-- Designation -->

                <div class="form-group">

                    <label>
                        Designation
                    </label>

                    <input
                        type="text"
                        name="designation"
                        placeholder="e.g. HR Manager">

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label>
                        Password <span class="required">*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            name="password"
                            placeholder="Create password"
                            required>

                    </div>

                </div>


                <!-- Address -->

                <div class="form-group full">

                    <label>
                        Address
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter HR address"></textarea>

                </div>

            </div>


            <!-- Buttons -->

            <div class="button-box">

                <a href="AdminHome.jsp" class="back">
                    ← Back
                </a>

                <button type="submit">
                    + &nbsp;Save HR
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
